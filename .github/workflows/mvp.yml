name: MVP local release acceptance
on:
  pull_request:
  push:
    branches: [main, master, codex/owner-paper-mvp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify candidate identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Prepare fresh hosted evidence
        id: evidence
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf -- docs/evidence/hosted-ci/ docs/evidence/phase3-browser-artifacts/ \
            docs/evidence/phase3-browser-report.json docs/evidence/phase3-process-report.json test-results/
          mkdir -p docs/evidence/hosted-ci
          {
            printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$(git rev-parse HEAD)"
            printf 'run_id=%s\nrun_attempt=%s\nevent=%s\nref=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$GITHUB_REF"
            printf 'runner_node=%s\n' "$(node --version)"
            printf 'identity_only_is_not_acceptance=true\n'
          } > docs/evidence/hosted-ci/identity.txt
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Record acceptance Node version
        run: node --version > docs/evidence/hosted-ci/acceptance-node.txt
      - name: Install test runner and Chromium
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --rm --name day-trader-mvp-ci -p 127.0.0.1:27189:27017 mongo:7 --replSet mvp --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec day-trader-mvp-ci mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec day-trader-mvp-ci mongosh --quiet --eval 'rs.initiate({_id:"mvp",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec day-trader-mvp-ci mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then break; fi
            sleep 1
          done
          docker exec day-trader-mvp-ci mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'
      - name: Run complete deterministic local release acceptance
        run: node scripts/verify-mvp.mjs --report-dir docs/evidence/hosted-ci
      - uses: actions/upload-artifact@v6
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        with:
          name: mvp-verification
          path: |
            docs/evidence/hosted-ci/
            docs/evidence/phase3-browser-artifacts/
            docs/evidence/phase3-browser-report.json
            docs/evidence/phase3-process-report.json
            test-results/
      - name: Remove only test container
        if: always()
        run: docker stop day-trader-mvp-ci || true
