app = "day-trader-frontend"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_API_URL = "https://day-trader-backend.fly.dev"
    VITE_REGISTRATION_ENABLED = "false"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"
